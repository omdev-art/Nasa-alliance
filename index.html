<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Omexla x NASA Cosmic Archive</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap');

  * {
    box-sizing: border-box;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    margin: 0;
    padding: 12px;
    background: #030408;
    font-family: 'Plus Jakarta Sans', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }

  .archive-card {
    position: relative;
    width: 100%;
    max-width: 520px;
    background: linear-gradient(145deg, rgba(18, 22, 38, 0.95), rgba(10, 12, 22, 0.98));
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border: 1px solid rgba(139, 92, 246, 0.35);
    border-radius: 24px;
    padding: 24px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 
                inset 0 1px 0 rgba(255, 255, 255, 0.12),
                0 0 35px rgba(139, 92, 246, 0.2);
    overflow: hidden;
  }

  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 18px;
  }

  .badge {
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(139, 92, 246, 0.12);
    border: 1px solid rgba(139, 92, 246, 0.4);
    padding: 6px 14px;
    border-radius: 30px;
  }

  .pulse-dot {
    width: 7px;
    height: 7px;
    background-color: #a78bfa;
    border-radius: 50%;
    box-shadow: 0 0 12px #a78bfa;
    animation: smooth-pulse 2s infinite ease-in-out;
  }

  .badge-text {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 11px;
    font-weight: 700;
    color: #c4b5fd;
    letter-spacing: 1.5px;
    text-transform: uppercase;
  }

  .input-section {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 18px;
  }

  .input-row {
    display: flex;
    gap: 10px;
  }

  .date-box-wrapper {
    flex: 1;
    position: relative;
    background: rgba(8, 10, 18, 0.9);
    border: 1px solid rgba(139, 92, 246, 0.35);
    border-radius: 14px;
    padding: 0 14px;
    display: flex;
    align-items: center;
  }

  input[type="date"] {
    width: 100%;
    background: transparent;
    border: none;
    color: #f8fafc;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 14px;
    outline: none;
    padding: 12px 0;
    color-scheme: dark;
    cursor: pointer;
  }

  .scan-btn {
    background: linear-gradient(135deg, #7c3aed, #4f46e5);
    border: none;
    color: #fff;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 13px;
    font-weight: 700;
    padding: 0 24px;
    border-radius: 14px;
    cursor: pointer;
    box-shadow: 0 6px 18px rgba(124, 58, 237, 0.4);
    transition: all 0.2s ease;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .scan-btn:hover {
    background: linear-gradient(135deg, #8b5cf6, #6366f1);
  }

  .result-frame {
    position: relative;
    background: rgba(6, 8, 15, 0.85);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 18px;
    padding: 12px;
  }

  .media-container {
    width: 100%;
    height: 320px;
    border-radius: 14px;
    overflow: hidden;
    background: #000;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  iframe {
    width: 100%;
    height: 100%;
    border: none;
    border-radius: 14px;
  }

  .alliance-glaze {
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1px solid rgba(255, 255, 255, 0.08);
    text-align: center;
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 12px;
    font-weight: 600;
    line-height: 1.4;
    background: linear-gradient(135deg, #c084fc, #60a5fa, #818cf8);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  @keyframes smooth-pulse {
    0%, 100% { opacity: 0.4; transform: scale(0.9); }
    50% { opacity: 1; transform: scale(1.2); }
  }
</style>
</head>
<body>

<div class="archive-card">
  <div class="card-top">
    <div class="badge">
      <div class="pulse-dot"></div>
      <span class="badge-text">NASA Official Feed</span>
    </div>
  </div>

  <div class="input-section">
    <div class="input-row">
      <div class="date-box-wrapper">
        <input type="date" id="bday-input" min="1995-06-16">
      </div>
      <button class="scan-btn" onclick="triggerCosmicScan()">Scan</button>
    </div>
  </div>

  <div class="result-frame">
    <div class="media-container" id="media-slot">
      <div style="color:#94a3b8; font-size:12px;">Select date to load...</div>
    </div>
  </div>

  <div class="alliance-glaze">
    Powered by the formidable alliance between Omexla's next-generation digital interface and NASA's legendary space exploration archives to bring you unmatched astronomical precision.
  </div>
</div>

<script>
  const todayStr = new Date().toISOString().split('T')[0];
  const dateInput = document.getElementById('bday-input');
  dateInput.max = todayStr;
  dateInput.value = "2020-01-01"; // Default date

  function triggerCosmicScan() {
    const dateVal = dateInput.value;
    if (!dateVal) return;

    const mediaSlot = document.getElementById('media-slot');
    const [y, m, d] = dateVal.split('-');
    
    // Convert YYYY-MM-DD to YYMMDD format used by NASA APOD pages
    const apodPage = `https://apod.nasa.gov/apod/ap${y.slice(2)}${m}${d}.html`;

    // Render the NASA archival page inside the widget card container directly
    mediaSlot.innerHTML = `<iframe src="${apodPage}" title="NASA APOD View"></iframe>`;
  }

  window.addEventListener('DOMContentLoaded', triggerCosmicScan);
</script>

</body>
</html>
